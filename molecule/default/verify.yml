---
- name: Verify
  hosts: all
  vars:
    endpoint: "http://{{ ansible_facts.default_ipv4.address }}:2379"
  tasks:
    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that etcd runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['etcd.service'].state == 'running'
          - ansible_facts.services['etcd.service'].status == 'enabled'

    - name: Check that the peer port listens
      ansible.builtin.wait_for:
        host: "{{ ansible_facts.default_ipv4.address }}"
        port: 2380
        timeout: 10

    - name: Check that the endpoint is healthy
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} endpoint health
      register: health
      changed_when: false
      failed_when: "'is healthy' not in health.stderr + health.stdout"

    - name: List the members
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} member list --write-out json
      register: members
      changed_when: false

    - name: Check that the host is the only member, named after its fqdn, with the advertised urls
      ansible.builtin.assert:
        that:
          - member_list | length == 1
          - member_list[0].name == ansible_facts.fqdn
          - member_list[0].peerURLs == ['http://' ~ ansible_facts.default_ipv4.address ~ ':2380']
          - member_list[0].clientURLs == [endpoint]
      vars:
        member_list: "{{ (members.stdout | from_json).members }}"

    - name: Write a key
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} put molecule/test verified
      changed_when: false

    - name: Read the key
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} get molecule/test --print-value-only
      register: value
      changed_when: false
      failed_when: value.stdout != 'verified'

    - name: Read the etcd configuration
      ansible.builtin.slurp:
        src: /etc/etcd/etcd.conf
      register: etcd_conf

    - name: Check the additional environment variables and the data directory
      ansible.builtin.assert:
        that:
          - "'ETCD_AUTO_COMPACTION_MODE=\"revision\"' in conf"
          - "'ETCD_DATA_DIR=\"/var/lib/etcd/test-cluster-name.etcd\"' in conf"
      vars:
        conf: "{{ etcd_conf.content | b64decode }}"

    - name: Check that etcd keeps its data in the data directory
      ansible.builtin.stat:
        path: /var/lib/etcd/test-cluster-name.etcd/member/wal
      register: wal
      failed_when: not wal.stat.isdir | default(false)

# Simulate a package upgrade outside the role (e.g. by the linux role or
# unattended-upgrades): replace the etcd binary (new ctime) after etcd started.
# Running the role again must then restart etcd, and only then: the role first
# runs once without the replace, and must not restart etcd.
- name: Verify the restart after an upgraded binary
  hosts: all
  vars:
    endpoint: "http://{{ ansible_facts.default_ipv4.address }}:2379"
    # The configuration of side_effect.yml, so only the binary triggers a restart
    etcd_additional_envvars:
      ETCD_AUTO_COMPACTION_RETENTION: 1
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_HEARTBEAT_INTERVAL: 100
  tasks:
    - name: Read the etcd main pid before the upgrade
      ansible.builtin.systemd_service:
        name: etcd
      register: pid_before

    - name: Run the role without an upgrade
      ansible.builtin.include_role:
        name: pgvillage.etcd

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the etcd main pid after the run without an upgrade
      ansible.builtin.systemd_service:
        name: etcd
      register: pid_unchanged

    - name: Check that etcd was not restarted
      ansible.builtin.assert:
        that: pid_unchanged.status.MainPID == pid_before.status.MainPID

    - name: Wait, as the start time and ctime are compared in whole seconds
      ansible.builtin.pause:
        seconds: 2

    - name: Replace the etcd binary, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/bin/etcd /usr/bin/etcd.new && mv /usr/bin/etcd.new /usr/bin/etcd
      changed_when: true

    - name: Run the role again
      ansible.builtin.include_role:
        name: pgvillage.etcd

    - name: Run the handlers after the upgrade
      ansible.builtin.meta: flush_handlers

    - name: Read the etcd main pid after the upgrade
      ansible.builtin.systemd_service:
        name: etcd
      register: pid_after

    - name: Check that etcd was restarted
      ansible.builtin.assert:
        that:
          - pid_after.status.MainPID | int > 0
          - pid_after.status.MainPID != pid_before.status.MainPID
        fail_msg: "PID before: {{ pid_before.status.MainPID }}, after: {{ pid_after.status.MainPID }}"

    - name: Check that the endpoint is healthy
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} endpoint health
      register: health
      changed_when: false
      failed_when: "'is healthy' not in health.stderr + health.stdout"

    - name: Check that the key written before the restart is still there
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} get molecule/test --print-value-only
      register: value
      changed_when: false
      failed_when: value.stdout != 'verified'

# An old package installed etcd in /usr/local/bin, while the unit points to
# etcd_install_dir (/usr/bin). Simulate that by moving the binary away: the role
# must fail with a clear message before it changes the unit, and etcd keeps running.
- name: Verify the failure when the etcd binary is missing
  hosts: all
  vars:
    endpoint: "http://{{ ansible_facts.default_ipv4.address }}:2379"
    etcd_additional_envvars:
      ETCD_AUTO_COMPACTION_RETENTION: 1
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_HEARTBEAT_INTERVAL: 100
  tasks:
    - name: Move the etcd binary away, as if an old package put it in /usr/local/bin
      ansible.builtin.command: mv /usr/bin/etcd /usr/local/bin/etcd
      changed_when: true

    - name: Run the role with the binary missing
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: pgvillage.etcd

        - name: The role should have failed
          ansible.builtin.fail:
            msg: The role did not fail on the missing etcd binary
      rescue:
        - name: Check the failure message
          ansible.builtin.assert:
            that:
              - "'/usr/bin/etcd does not exist' in ansible_failed_result.msg"
              - "'etcd_package_version: latest' in ansible_failed_result.msg"
            fail_msg: "{{ ansible_failed_result.msg }}"
      always:
        - name: Put the etcd binary back
          ansible.builtin.command: mv /usr/local/bin/etcd /usr/bin/etcd
          changed_when: true

    - name: Read the etcd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/etcd.service
      register: etcd_unit

    - name: Check that the unit still points to /usr/bin/etcd
      ansible.builtin.assert:
        that: "'/usr/bin/etcd' in etcd_unit.content | b64decode"

    - name: Check that the endpoint is still healthy
      ansible.builtin.command: etcdctl --endpoints {{ endpoint }} endpoint health
      register: health
      changed_when: false
      failed_when: "'is healthy' not in health.stderr + health.stdout"
