---
- name: Install etcd package
  ansible.builtin.package:
    name: "{{ etcd_package_name }}"
    state: "{{ etcd_package_version }}"
  register: etcd_package_installed
  # An upgraded package (e.g. 3.7.1 -> 3.7.3) only takes effect after a restart
  notify: Restart etcd

# Older pgvillage packages installed etcd in /usr/local/bin, newer ones in
# /usr/bin. With `present` an old package stays, and the unit would point to a
# binary that is not there: fail before the config and unit change.
- name: Check that the etcd binary exists
  ansible.builtin.stat:
    path: "{{ etcd_install_dir }}/etcd"
  register: etcd_binary

- name: Fail when the etcd binary is missing
  ansible.builtin.fail:
    msg: >-
      {{ etcd_install_dir }}/etcd does not exist after installing package
      {{ etcd_package_name }} (state {{ etcd_package_version }}).
      Older pgvillage packages install etcd in /usr/local/bin.
      Set etcd_package_version: latest (once) to move to the new package,
      or set etcd_install_dir: /usr/local/bin to keep the old build.
  when:
    - not etcd_binary.stat.exists
    # In check mode a package that is not installed yet has no binary
    - not (ansible_check_mode and etcd_package_installed is changed)

- name: Collect facts
  ansible.builtin.set_fact:
    cacheable: true
    etcd_listen_public: >-
      {{
         "0.0.0.0" if etcd_iface_public == "all"
         else ansible_facts.default_ipv4.address if etcd_iface_public == "default"
         else hostvars[inventory_hostname].ansible_facts[etcd_iface_public].ipv4.address
      }}
    etcd_listen_cluster: >-
      {{
         "0.0.0.0" if etcd_iface_cluster == "all"
         else ansible_facts.default_ipv4.address if etcd_iface_cluster == "default"
         else hostvars[inventory_hostname].ansible_facts[etcd_iface_cluster].ipv4.address
      }}
    etcd_address_public: >-
      {{
         ansible_facts.fqdn if not etcd_use_ips | bool
         else ansible_facts.default_ipv4.address if etcd_iface_public in [ "all", "default" ]
         else hostvars[inventory_hostname].ansible_facts[etcd_iface_public].ipv4.address
      }}
    etcd_address_cluster: >-
      {{
         ansible_facts.fqdn if not etcd_use_ips | bool
         else ansible_facts.default_ipv4.address if etcd_iface_cluster in [ "all", "default" ]
         else hostvars[inventory_hostname].ansible_facts[etcd_iface_cluster].ipv4.address
      }}

- name: Create etcd group
  become: true
  become_user: root
  ansible.builtin.group:
    name: "{{ etcd_group }}"
    state: present

- name: Create etcd user
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    home: "{{ etcd_data_dir }}"
    state: present

- name: Create dirs...
  become: true
  become_user: root
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0755"
  with_items:
    - /etc/etcd
    - "{{ etcd_cluster_pki_dir }}"

- name: Setup all pki certificates
  ansible.builtin.include_tasks: pki.yml
  when: etcd_secure | bool

- name: Install etcd.service configuration
  become: true
  become_user: root
  with_items:
    - f: etcd.conf
      d: /etc/etcd
  ansible.builtin.template:
    src: "{{ item.f }}.j2"
    dest: "{{ item.d }}/{{ item.f }}"
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0644"
  notify: Restart etcd

- name: Setup etcd in {{ etcd_init_system }}
  ansible.builtin.include_tasks: "{{ etcd_init_system }}.yml"
